<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}svg{display:block}text{font-family:'Inter','DejaVu Sans',sans-serif}</style></head>
<body><svg id="s" xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 576 1024"></svg>
<script>
const W=576,H=1024;
let EP=null,STARTS=[];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-2*(1-x)*(1-x);
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const GOLD='#ffc83d',RED='#ff4d4d',CY='#5cd6ff',GREEN='#34d399';

window.__load=(ep)=>{EP=ep;let t=0;STARTS=ep.beats.map(b=>{const s=t;t+=b.d;return s});window.__total=t;return t};

/* ---------- characters & props ---------- */
function person(x,y,s,o,t){
  const {skin='#c68b5e',hair='#1b1b24',suit='#e8edf2',expr='neutral',seed=0,cap=false,patch='',accent='#2b5fd9'}=o;
  const fx=Math.sin(t*.9+seed)*5,fy=Math.cos(t*.7+seed*2)*7,rot=Math.sin(t*.6+seed)*3.5;
  const blink=((t*.6+seed)%3.4)<.12;
  const eye=cx=>blink?`<rect x="${cx-8}" y="-8" width="16" height="3.5" rx="1.7" fill="#1a1a1a"/>`
    :`<ellipse cx="${cx}" cy="-6" rx="6.5" ry="${expr==='shock'?10:8}" fill="#1a1a1a"/><circle cx="${cx+2}" cy="-9" r="2.2" fill="#fff"/>`;
  let brows='',mouth='';
  if(expr==='worry'){brows=`<path d="M-30 -24 L-12 -30" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/><path d="M30 -24 L12 -30" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>`;mouth=`<path d="M-12 26 Q-6 18 0 24 Q6 30 12 22" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>`}
  else if(expr==='shock'){brows=`<path d="M-30 -30 L-12 -34" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/><path d="M30 -30 L12 -34" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>`;mouth=`<ellipse cx="0" cy="26" rx="8" ry="11" fill="#2a1515"/>`}
  else if(expr==='determined'){brows=`<path d="M-32 -26 L-10 -18" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/><path d="M32 -26 L10 -18" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>`;mouth=`<path d="M-14 26 L14 26" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>`}
  else if(expr==='smile'){mouth=`<path d="M-15 20 Q0 36 15 20" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>`}
  else {mouth=`<path d="M-11 26 Q0 28 11 26" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>`}
  const hairP=cap?`<path d="M-54 -6 Q-56 -64 0 -62 Q56 -64 54 -6 L54 -14 Q0 -26 -54 -14Z" fill="${hair}"/><rect x="-58" y="-18" width="116" height="9" rx="4" fill="${hair}"/>`
    :`<path d="M-52 -4 Q-58 -66 0 -62 Q58 -66 52 -4 Q32 -36 0 -32 Q-32 -36 -52 -4Z" fill="${hair}"/>`;
  return `<g transform="translate(${x+fx} ${y+fy}) rotate(${rot}) scale(${s})">
   <path d="M-66 170 Q-66 64 0 58 Q66 64 66 170 Z" fill="${suit}"/>
   <path d="M-22 58 L0 84 L22 58" fill="none" stroke="#c7ced6" stroke-width="5" stroke-linejoin="round"/>
   <rect x="-60" y="112" width="120" height="14" fill="${accent}" opacity=".9"/>
   ${patch?`<rect x="14" y="88" width="34" height="14" rx="3" fill="#fff" stroke="#9aa5b1"/><text x="31" y="99" text-anchor="middle" font-size="8" font-weight="800" fill="#223">${patch}</text>`:''}
   <ellipse cx="-52" cy="-2" rx="8" ry="12" fill="${skin}"/><ellipse cx="52" cy="-2" rx="8" ry="12" fill="${skin}"/>
   <circle cx="0" cy="0" r="52" fill="${skin}"/>${hairP}
   ${eye(-19)}${eye(19)}${brows}${mouth}</g>`;
}
function biscuit(x,y,s,t,seed=3){
  const rot=Math.sin(t*.8+seed)*18,fy=Math.sin(t*.9+seed)*10;
  return `<g transform="translate(${x} ${y+fy}) rotate(${rot}) scale(${s})">
   <path d="M-34 -22 Q-56 -4 -44 22 Q-34 14 -26 -4Z" fill="#7a4a2b"/><path d="M34 -22 Q56 -4 44 22 Q34 14 26 -4Z" fill="#7a4a2b"/>
   <circle r="36" fill="#d9a066"/><ellipse cx="0" cy="12" rx="20" ry="15" fill="#f3d9b5"/>
   <circle cx="-13" cy="-6" r="5" fill="#1a1a1a"/><circle cx="13" cy="-6" r="5" fill="#1a1a1a"/>
   <ellipse cx="0" cy="6" rx="7" ry="5" fill="#1a1a1a"/><path d="M0 11 L0 17 M0 17 Q-6 22 -10 18 M0 17 Q6 22 10 18" stroke="#1a1a1a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
   <rect x="-9" y="22" width="18" height="9" rx="4" fill="#e63946"/></g>`;
}
function smoke(t,cx,cy,n,spread=120,seed=1,col='#cfd3da',alpha=.35){
  const r=rng(seed);let o='';
  for(let i=0;i<n;i++){
    const ph=r(),ang=r()*6.28,sp=.25+r()*.5,age=((t*sp*.35+ph)%1);
    const d=age*spread,x=cx+Math.cos(ang+age*1.5)*d,y=cy+Math.sin(ang*1.3+age*1.2)*d*.8-age*30;
    o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(14+age*46).toFixed(1)}" fill="${col}" opacity="${(alpha*(1-age)).toFixed(3)}"/>`;
  }return o;
}
function stars(t,n=90,seed=7){const r=rng(seed);let o='';for(let i=0;i<n;i++){const x=r()*W,y=r()*H*.9,s=.6+r()*1.6,tw=.5+.5*Math.sin(t*2+i);o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s.toFixed(2)}" fill="#fff" opacity="${(.35+.55*tw*r()).toFixed(2)}"/>`}return o}
const defs=`<defs>
<linearGradient id="gSpace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#02030a"/><stop offset="1" stop-color="#0b1b3a"/></linearGradient>
<radialGradient id="gEarth" cx=".5" cy=".12" r=".9"><stop offset="0" stop-color="#3b82d6"/><stop offset=".55" stop-color="#1b4fa3"/><stop offset="1" stop-color="#0a1d45"/></radialGradient>
<linearGradient id="gPanel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c35c"/><stop offset="1" stop-color="#b8862a"/></linearGradient>
<radialGradient id="gFire" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#bff0ff"/><stop offset=".55" stop-color="#2f8cff" stop-opacity=".95"/><stop offset="1" stop-color="#1a3cff" stop-opacity="0"/></radialGradient>
<radialGradient id="gVig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a7f95"/><stop offset="1" stop-color="#3b4a5c"/></linearGradient>
</defs>`;

/* ---------- scenes ---------- */
const SC={};
SC.orbit=(t,p,b)=>{
  let o=`<rect x="-300" y="-300" width="${W+600}" height="${H+600}" fill="url(#gSpace)"/>`+stars(t);
  o+=`<circle cx="288" cy="1480" r="1000" fill="#6fb7ff" opacity=".18"/><circle cx="288" cy="1480" r="985" fill="url(#gEarth)"/>`;
  for(let i=0;i<9;i++){const r=rng(40+i);o+=`<ellipse cx="${(r()*520+30).toFixed(0)}" cy="${(560+r()*140).toFixed(0)}" rx="${(50+r()*70).toFixed(0)}" ry="${(8+r()*10).toFixed(0)}" fill="#fff" opacity=".22" transform="translate(${(t*6*(.5+r()))%80} 0)"/>`}
  o+=`<circle cx="470" cy="120" r="150" fill="#ffd9a0" opacity=".10"/><circle cx="470" cy="120" r="46" fill="#fff4d6" opacity=".9"/>`;
  const sy=400-p*10,rot=Math.sin(t*.4)*2;
  const panel=(x,y)=>`<g><rect x="${x}" y="${y}" width="54" height="130" fill="url(#gPanel)" stroke="#6b4d15" stroke-width="2"/>${[1,2,3,4].map(i=>`<line x1="${x}" y1="${y+i*26}" x2="${x+54}" y2="${y+i*26}" stroke="#6b4d15" stroke-width="1.2"/>`).join('')}<line x1="${x+27}" y1="${y}" x2="${x+27}" y2="${y+130}" stroke="#6b4d15" stroke-width="1.2"/></g>`;
  o+=`<g transform="translate(0 ${sy-430}) rotate(${rot} 288 430)">
   <rect x="70" y="424" width="436" height="12" fill="#aab4c2"/>
   ${[100,180,394,474].map(x=>panel(x,296)+panel(x,448)).join('')}
   <rect x="232" y="396" width="112" height="68" rx="14" fill="#dfe5ec" stroke="#8c97a6" stroke-width="3"/>
   <rect x="254" y="340" width="68" height="60" rx="10" fill="#cfd7e0" stroke="#8c97a6" stroke-width="3"/>
   <rect x="254" y="460" width="68" height="60" rx="10" fill="#cfd7e0" stroke="#8c97a6" stroke-width="3"/>
   <circle cx="288" cy="430" r="10" fill="#223a5e"/><rect x="190" y="410" width="34" height="40" rx="8" fill="#e63946" opacity="${.5+.5*Math.sin(t*6)}"/>
  </g>`;
  return o};
SC.corridor=(t,p,b)=>{
  const tint=b.tint||0,vx=288,vy=470;
  let o=`<rect x="-300" y="-300" width="${W+600}" height="${H+600}" fill="#2d3948"/>
   <polygon points="0,0 150,300 150,640 0,1024" fill="#8195ab"/><polygon points="${W},0 426,300 426,640 ${W},1024" fill="#8195ab"/>
   <polygon points="0,0 ${W},0 426,300 150,300" fill="#b5c3d1"/><polygon points="0,1024 ${W},1024 426,640 150,640" fill="#56667a"/>
   <rect x="150" y="300" width="276" height="340" fill="#3c4858"/>`;
  for(let i=0;i<5;i++){const k=i/5,y=lerp(40,290,k*k);o+=`<rect x="${lerp(230,262,k)}" y="${y}" width="${lerp(116,52,k)}" height="${lerp(18,6,k)}" fill="#fff" opacity=".9"/>`}
  [['#e63946',60],['#3b82f6',110],['#22c55e',160]].forEach(([c,xx],i)=>{o+=`<line x1="${xx}" y1="0" x2="${150+i*8}" y2="300" stroke="${c}" stroke-width="5"/><line x1="${W-xx}" y1="0" x2="${426-i*8}" y2="300" stroke="${c}" stroke-width="5"/>`});
  o+=`<line x1="30" y1="1024" x2="150" y2="640" stroke="#f59e0b" stroke-width="6"/><line x1="${W-30}" y1="1024" x2="426" y2="640" stroke="#f59e0b" stroke-width="6"/>`;
  o+=`<circle cx="${vx}" cy="${vy}" r="90" fill="#cfd8e3" stroke="#7d8a9a" stroke-width="8"/><circle cx="${vx}" cy="${vy}" r="62" fill="#aeb9c7"/><circle cx="${vx}" cy="${vy-10}" r="22" fill="#26323f"/>`;
  if(b.biscuit)o+=biscuit(lerp(80,430,p),lerp(760,700,p),1.1,t);
  if(b.people)o+=b.people.map(q=>person(q.x,q.y,q.s,{...q.o},t)).join('');
  if(tint)o+=`<rect x="-300" y="-300" width="${W+600}" height="${H+600}" fill="#ff1e1e" opacity="${(tint*(.15+.2*Math.sin(t*9)**2)).toFixed(2)}"/>`;
  return o};
SC.alarm=(t,p,b)=>{
  let o=SC.corridor(t,p,{tint:.9});
  const f=.5+.5*Math.sin(t*9);
  o+=`<circle cx="288" cy="330" r="${60+f*30}" fill="#ff2a2a" opacity="${(.15+.25*f).toFixed(2)}"/><circle cx="288" cy="330" r="44" fill="#d61f2c" stroke="#fff" stroke-width="5"/><circle cx="288" cy="330" r="22" fill="#ff6b6b" opacity="${(.5+.5*f).toFixed(2)}"/>`;
  o+=smoke(t,288,520,10,150,5,'#bfc6cf',.3);return o};
SC.faces=(t,p,b)=>{
  let o=`<rect x="-300" y="-300" width="${W+600}" height="${H+600}" fill="url(#gWall)"/><circle cx="288" cy="200" r="120" fill="#0b1b3a" stroke="#c7d0dc" stroke-width="14"/><circle cx="288" cy="200" r="104" fill="url(#gEarth)"/>`;
  o+=`<rect x="0" y="760" width="${W}" height="264" fill="#2a3544"/>`;
  const e=b.expr||'neutral',e2=b.expr2||e;
  o+=person(170,500,1.7,{expr:e,skin:'#a97452',hair:'#201c2b',suit:'#dfe6ee',seed:1,patch:'AVA',accent:'#e63946'},t);
  o+=person(410,540,1.55,{expr:e2,skin:'#d7a477',hair:'#2a2118',cap:true,suit:'#dfe6ee',seed:4,patch:'TEO'},t);
  return o};
SC.biscuit=(t,p,b)=>{
  let o=`<rect x="-300" y="-300" width="${W+600}" height="${H+600}" fill="url(#gWall)"/><rect x="0" y="780" width="${W}" height="244" fill="#2a3544"/>`;
  o+=`<g opacity=".5">${[0,1,2,3].map(i=>`<rect x="${40+i*130}" y="120" width="90" height="140" rx="12" fill="#506378"/>`).join('')}</g>`;
  o+=biscuit(288,470,3.1,t);return o};
SC.hatch=(t,p,b)=>{
  const glow=b.glow??0,ang=(b.wheel?p*90:0);
  let o=`<rect x="-300" y="-300" width="${W+600}" height="${H+600}" fill="url(#gWall)"/>`;
  o+=`<circle cx="288" cy="470" r="230" fill="#7b8da1" stroke="#4a596b" stroke-width="12"/><circle cx="288" cy="470" r="196" fill="#9fb0c3" stroke="#6c7c8f" stroke-width="8"/>`;
  o+=`<circle cx="288" cy="330" r="52" fill="#0b0f1a" stroke="#d3dbe5" stroke-width="10"/>`;
  if(glow>0){const f=.8+.2*Math.sin(t*10);o+=`<circle cx="288" cy="330" r="44" fill="#ff7a18" opacity="${(glow*f).toFixed(2)}"/><circle cx="288" cy="330" r="22" fill="#ffd27a" opacity="${(glow*f).toFixed(2)}"/><circle cx="288" cy="330" r="150" fill="#ff7a18" opacity="${(glow*.16*f).toFixed(2)}"/>`}
  o+=`<g transform="rotate(${ang} 288 520)"><circle cx="288" cy="520" r="62" fill="#c8d2de" stroke="#5a687a" stroke-width="8"/>${[0,60,120].map(a=>`<rect x="278" y="${520-100}" width="20" height="200" rx="10" fill="#d9e1ea" stroke="#5a687a" stroke-width="5" transform="rotate(${a} 288 520)"/>`).join('')}<circle cx="288" cy="520" r="18" fill="#e63946"/></g>`;
  o+=`<rect x="178" y="690" width="220" height="38" rx="8" fill="#f3f4f6"/><text x="288" y="716" text-anchor="middle" font-size="19" font-weight="800" fill="#e63946">${b.label||'SERVICE MODULE'}</text>`;
  if(glow>.5)o+=smoke(t,288,330,6,120,9,'#9aa0aa',.35);
  if(b.person)o+=person(130,760,1.1,{expr:b.person,skin:'#d7a477',hair:'#2a2118',cap:true,suit:'#dfe6ee',seed:4,patch:'TEO'},t);
  return o};
SC.fire=(t,p,b)=>{
  let o=`<rect x="-300" y="-300" width="${W+600}" height="${H+600}" fill="#070a14"/><circle cx="288" cy="480" r="330" fill="#0e1424" stroke="#26314a" stroke-width="10"/>`;
  o+=`<g stroke="#1b2540" stroke-width="3">${[0,1,2,3,4,5].map(i=>`<line x1="288" y1="480" x2="${288+330*Math.cos(i*1.047)}" y2="${480+330*Math.sin(i*1.047)}"/>`).join('')}</g>`;
  const r=(b.sphere??1)*(86+8*Math.sin(t*7)+6*Math.sin(t*13));
  o+=`<circle cx="288" cy="480" r="${(r*2.1).toFixed(1)}" fill="url(#gFire)" opacity=".6"/><circle cx="288" cy="480" r="${r.toFixed(1)}" fill="url(#gFire)"/>`;
  const rr=rng(11);for(let i=0;i<14;i++){const a=rr()*6.28+t*(.3+rr()*.6),d=140+rr()*140;o+=`<circle cx="${(288+Math.cos(a)*d).toFixed(1)}" cy="${(480+Math.sin(a)*d*.9).toFixed(1)}" r="${(3+rr()*6).toFixed(1)}" fill="#7fd0ff" opacity=".55"/>`}
  if(b.smoke!==false)o+=smoke(t,288,480,b.smokeN||12,260,3,'#aab0bb',.28);
  return o};
SC.schematic=(t,p,b)=>{
  const st=b.step||0;
  let o=`<rect x="-300" y="-300" width="${W+600}" height="${H+600}" fill="#08122a"/>`;
  o+=`<g stroke="#12244d" stroke-width="1">${Array.from({length:19},(_,i)=>`<line x1="${i*32}" y1="0" x2="${i*32}" y2="${H}"/>`).join('')}${Array.from({length:33},(_,i)=>`<line x1="0" y1="${i*32}" x2="${W}" y2="${i*32}"/>`).join('')}</g>`;
  const mod=(x,y,w,h,label,c='#7fb2ff')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#0d1f45" stroke="${c}" stroke-width="3"/><text x="${x+w/2}" y="${y+20}" text-anchor="middle" font-size="12" font-weight="800" fill="${c}">${label}</text>`;
  o+=`<line x1="120" y1="480" x2="456" y2="480" stroke="#3a5aa0" stroke-width="6"/>`;
  const capA=st>=4?'#ffc83d':'#7fb2ff',capB=st>=3?'#ffc83d':'#7fb2ff';
  o+=mod(24,425,96,110,'CAPSULE A',capA)+mod(140,440,90,80,'LAB')+mod(250,430,76,100,'HUB')+mod(346,440,100,80,'SERVICE',st>=1?'#ff4d4d':'#7fb2ff')+mod(466,425,90,110,'CAPSULE B',capB);
  if(st>=4)o+=`<text x="72" y="570" text-anchor="middle" font-size="22" font-weight="900" fill="${GOLD}">3 SEATS</text><text x="72" y="396" text-anchor="middle" font-size="22" font-weight="900" fill="${GOLD}">A</text>`;
  const crew=[[170,502],[205,502],[268,512],[288,512],[308,512],[250,512]];
  crew.forEach(([x,y],i)=>{o+=`<circle cx="${x+Math.sin(t*1.3+i)*3}" cy="${y+Math.cos(t*1.1+i)*3}" r="7" fill="#fff"/>`});
  if(st>=1){const f=.5+.5*Math.sin(t*8);o+=`<circle cx="396" cy="495" r="${44+f*12}" fill="#ff3b30" opacity="${(.18+.2*f).toFixed(2)}"/><path d="M396 475 Q384 499 396 515 Q408 499 396 475Z" fill="#ff7a18"/><path d="M396 487 Q390 501 396 511 Q402 501 396 487Z" fill="#ffd27a"/>`}
  if(st>=2){o+=`<path d="M330 410 Q400 360 470 410" fill="none" stroke="#ff4d4d" stroke-width="5" stroke-dasharray="10 8"/><text x="400" y="372" text-anchor="middle" font-size="40" font-weight="900" fill="#ff4d4d">×</text>`}
  if(b.count)o+=`<text x="288" y="700" text-anchor="middle" font-size="22" font-weight="800" fill="#9db4e6">CREW ${b.count}</text>`;
  return o};
SC.fans=(t,p,b)=>{
  const speed=b.spin??1,ang=(b.stopAt!==undefined?(1-ease(clamp(p/b.stopAt)))*t*900:t*900*speed)%360;
  let o=`<rect x="-300" y="-300" width="${W+600}" height="${H+600}" fill="url(#gWall)"/>`;
  o+=`<circle cx="288" cy="460" r="210" fill="#46566a" stroke="#2b3848" stroke-width="14"/><circle cx="288" cy="460" r="176" fill="#1a232f"/>`;
  o+=`<g transform="rotate(${ang} 288 460)">${[0,72,144,216,288].map(a=>`<path d="M288 460 Q330 380 288 286 Q250 380 288 460Z" fill="#8b9bb0" transform="rotate(${a} 288 460)"/>`).join('')}</g><circle cx="288" cy="460" r="24" fill="#d3dbe5"/>`;
  if(b.smoke)o+=smoke(t,288,460,9,200,8,'#b9bfc8',.3);
  if(b.biscuit)o+=biscuit(lerp(120,160,p),760,1.5,b.still?0:t,2);
  return o};
SC.black=(t,p,b)=>{
  let o=`<rect x="-300" y="-300" width="${W+600}" height="${H+600}" fill="#04060c"/>`;
  const f=.5+.5*Math.sin(t*14);
  o+=`<circle cx="288" cy="470" r="${120+f*20}" fill="none" stroke="#ff4d4d" stroke-width="3" opacity="${(.25+.4*f).toFixed(2)}"/><circle cx="288" cy="470" r="70" fill="none" stroke="#ff4d4d" stroke-width="3" opacity=".4"/>`;
  o+=`<text x="288" y="490" text-anchor="middle" font-size="64" font-weight="900" fill="#ff4d4d" opacity="${(.5+.5*f).toFixed(2)}">PSSSSHH</text>`;
  return o};
SC.card=(t,p,b)=>`<rect x="-300" y="-300" width="${W+600}" height="${H+600}" fill="#0b0f19"/>
 <text x="288" y="380" text-anchor="middle" font-size="15" font-weight="800" fill="#9aa5b8" letter-spacing="2">${b.series}</text>
 <text transform="translate(288 470) scale(.9 1)" text-anchor="middle" font-size="76" font-weight="900" fill="#fff">PART ${b.next}</text>
 <rect x="236" y="490" width="104" height="4" fill="#e63946"/>
 <text x="288" y="548" text-anchor="middle" font-size="26" font-weight="900" fill="${CY}" letter-spacing="1">${b.title}</text>
 <text x="288" y="610" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">${b.q1}</text><text x="288" y="644" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">${b.q2}</text>
 <text x="288" y="706" text-anchor="middle" font-size="16" font-weight="900" fill="${GOLD}" letter-spacing="1.5">${b.follow}</text>
 <text x="288" y="760" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7587" letter-spacing="1">STORY = FICTION · FACTS = REAL</text>`;

/* ---------- overlays ---------- */
function pill(x,y,text,fill,color,fs=12,pad=14){const w=text.length*fs*.62+pad*2;return `<rect x="${x-w/2}" y="${y-fs}" width="${w}" height="${fs*2}" rx="${fs}" fill="${fill}"/><text x="${x}" y="${y+fs*.36}" text-anchor="middle" font-size="${fs}" font-weight="900" fill="${color}" letter-spacing=".8">${text}</text>`}
function markup(s){return s.replace(/\{([grb]):([^}]*)\}/g,(m,k,x)=>`<tspan fill="${k==='g'?GOLD:k==='r'?RED:CY}">${x}</tspan>`)}
function caption(text,lt){
  const pop=1+.17*Math.max(0,1-lt/.18);
  return `<g id="capg" data-pop="${pop.toFixed(3)}" transform="translate(288 668) scale(${(.86*pop).toFixed(3)} ${pop.toFixed(3)})"><text id="capt" text-anchor="middle" font-size="46" font-weight="900" fill="#fff" stroke="#000" stroke-width="9" stroke-linejoin="round" paint-order="stroke" letter-spacing="-.5" style="paint-order:stroke">${markup(text)}</text></g>`}
function overlays(b,t,lt){
  let o='';
  // series tag + clock
  o+=`<rect x="170" y="30" width="236" height="22" rx="3" fill="#c1121f"/><text x="288" y="46" text-anchor="middle" font-size="12.5" font-weight="900" fill="#fff" letter-spacing="1.4">${EP.series}</text>`;
  const c=b.chip;
  if(c&&c.type==='real')o+=`<g transform="translate(0 ${6})">${(()=>{const txt=c.text;const w=txt.length*7.4+84;return `<rect x="${288-w/2}" y="70" width="${w}" height="34" rx="17" fill="#e8f7ee" stroke="#34d399" stroke-width="2"/><rect x="${288-w/2+8}" y="78" width="50" height="18" rx="9" fill="#34d399"/><text x="${288-w/2+33}" y="91" text-anchor="middle" font-size="11" font-weight="900" fill="#05331f">REAL</text><text x="${288-w/2+66}" y="92" font-size="13" font-weight="800" fill="#0b3d2a">${txt}</text>`})()}</g>`;
  if(c&&c.type==='tag')o+=`<g><rect x="36" y="84" width="${Math.max(170,c.name.length*15+40)}" height="52" rx="6" fill="#f4f1ea" stroke="#b9b2a2"/><text x="52" y="112" font-size="22" font-weight="900" fill="#1c1c24">${c.name}</text><text x="52" y="128" font-size="10.5" font-weight="800" fill="#6d6a60" letter-spacing="1">${c.sub}</text></g>`;
  if(c&&c.type==='rule')o+=`<g transform="translate(288 150) rotate(${-1+Math.sin(t*1.5)*.4})"><rect x="-210" y="-56" width="420" height="112" rx="8" fill="#f6f3ea" stroke="#d0c9b6" stroke-width="2"/><rect x="-206" y="-52" width="150" height="20" fill="#c1121f"/><text x="-131" y="-37" text-anchor="middle" font-size="12" font-weight="900" fill="#fff" letter-spacing="1.5">${c.no}</text><text x="0" y="14" text-anchor="middle" font-size="31" font-weight="900" fill="#17171f">${c.l1}</text><text x="0" y="46" text-anchor="middle" font-size="31" font-weight="900" fill="#c1121f">${c.l2}</text></g>`;
  if(c&&c.type==='hud'){const f=.5+.5*Math.sin(t*5);o+=`<g transform="translate(0 100)">${pill(288,0,c.text,'#7a0b14','#fff',16)}<circle cx="${288-(c.text.length*16*.62+28)/2-6}" cy="0" r="5" fill="#ff4d4d" opacity="${(.4+.6*f).toFixed(2)}"/></g>`}
  if(b.partPop){const k=clamp(lt/.25),s2=1+.4*(1-ease(k));o+=`<text transform="translate(288 245) scale(${s2.toFixed(3)})" text-anchor="middle" font-size="78" font-weight="900" fill="#ff3b3b" stroke="#2a0306" stroke-width="8" paint-order="stroke" style="paint-order:stroke">PART 1</text>`}
  return o}
/* ---------- frame ---------- */
window.__render=(t)=>{
  let i=STARTS.findIndex((s,k)=>t>=s&&(k===STARTS.length-1||t<STARTS[k+1]));if(i<0)i=0;
  const b=EP.beats[i],lt=t-STARTS[i],p=clamp(lt/b.d);
  const cam=b.cam||{},z=lerp((cam.z||[1,1.07])[0],(cam.z||[1,1.07])[1],ease(p));
  const cx=lerp((cam.x||[0,0])[0],(cam.x||[0,0])[1],ease(p)),cy=lerp((cam.y||[0,0])[0],(cam.y||[0,0])[1],ease(p));
  const sh=cam.shake||0,shx=Math.sin(t*61)*sh,shy=Math.cos(t*53)*sh;
  let body=SC[b.scene](t,p,b,lt);
  let o=defs+`<g transform="translate(288 512) scale(${z.toFixed(4)}) translate(${(-288-cx+shx).toFixed(2)} ${(-512-cy+shy).toFixed(2)})">${body}</g>`;
  o+=`<rect width="${W}" height="${H}" fill="url(#gVig)"/>`;
  if(b.scene!=='card'){
    o+=overlays(b,t,lt);
    (EP.pins||[]).forEach(pn=>{if(t>=pn.from&&t<pn.to){const k=clamp((t-pn.from)/.2);o+=`<g opacity="${k}"><text transform="translate(288 190) scale(.9 1)" text-anchor="middle" font-size="62" font-weight="900" fill="#ff3b3b" stroke="#2a0306" stroke-width="8" paint-order="stroke" style="paint-order:stroke">${pn.l1}</text><text transform="translate(288 236) scale(.86 1)" text-anchor="middle" font-size="34" font-weight="900" fill="#fff" stroke="#000" stroke-width="7" paint-order="stroke" style="paint-order:stroke">${pn.l2}</text></g>`}});
    if(b.cap)o+=caption(b.cap,lt);
    if(b.flash&&lt<.1)o+=`<rect width="${W}" height="${H}" fill="#fff" opacity="${(.55*(1-lt/.1)).toFixed(2)}"/>`;
  }
  document.getElementById('s').innerHTML=o;
  const g=document.getElementById('capg');
  if(g){const bw=document.getElementById('capt').getBBox().width,pop=+g.dataset.pop;const sx=Math.min(.86,500/bw);g.setAttribute('transform',`translate(288 668) scale(${(sx*pop).toFixed(3)} ${(pop*Math.max(sx/.86,.8)).toFixed(3)})`)}
  return i;
};
</script></body></html>
