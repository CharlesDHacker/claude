<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Garamond';font-weight:500;src:url('../fonts/eb-garamond-latin-500-normal.woff2')}
@font-face{font-family:'Nunito';font-weight:900;src:url('../fonts/nunito-latin-900-normal.woff2')}
html,body{margin:0;background:#000}</style></head><body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../art/lib.js"></script><script src="../art/chars.js"></script><script src="../art/scenes.js"></script>
<script>
const g = document.getElementById('c').getContext('2d'), WITH_TEXT = location.hash === '#text';
Promise.all([document.fonts.load('500 90px Garamond'), document.fonts.load('900 40px Nunito')]).then(() => {
  // sky
  g.fillStyle = lg(g, 0, 0, 0, 1080, [[0, '#4a2f6a'], [.45, '#e0784a'], [.8, '#ffc27a'], [1, '#ffd9a0']]); g.fillRect(0, 0, 1080, 1080);
  sun(g, 560, 560, 190, '#ffe6b0'); rays(g, 560, 560, 1300, 22, 'rgba(255,230,170,.55)', .55, 1.3);
  hills(g, 760, 40, '#9a5a6a', 2, -100, 1200, 30); hills(g, 820, 30, '#6e3a52', 5, -100, 1200, 30);
  g.fillStyle = lg(g, 0, 840, 0, 1080, [[0, '#5a3044'], [1, '#2e1824']]); g.fillRect(0, 840, 1080, 300);
  dust(g, 3.0, 30, 9, 'rgba(255,236,190,', [0, 0, 1080, 1080]);
  // Selah (right, facing left, leaning in) and Toby (left, beaming)
  donkey(g, { x: 1190, y: 1420, s: 1.5, flip: true, t: 0.4, pose: 'stand', expr: 'smile', look: [-.6, 0], headRot: -.05, ears: .05 });
  toby(g, { x: 330, y: 1250, s: 1.4, t: 0.4, expr: 'happy', hands: 'up', talk: .55, look: [.5, -.3], tilt: -.08 });
  // vignette + warm grade
  g.fillStyle = rg(g, 540, 540, 380, 760, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(30,10,5,.55)']]); g.fillRect(0, 0, 1080, 1080);
  if (WITH_TEXT) {
    g.fillStyle = lg(g, 0, 860, 0, 1080, [[0, 'rgba(30,12,8,0)'], [1, 'rgba(30,12,8,.85)']]); g.fillRect(0, 820, 1080, 260);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const gold = (txt, y, size, sp) => { g.font = `500 ${size}px Garamond`; const ws = [...txt].map(c => g.measureText(c).width), tw = ws.reduce((a, b) => a + b, 0) + sp * (txt.length - 1); let x = 540 - tw / 2;
      [...txt].forEach((c, i) => { g.textAlign = 'left'; g.lineWidth = 12; g.lineJoin = 'round'; g.strokeStyle = '#2a120a'; g.strokeText(c, x, y); const gr = g.createLinearGradient(0, y - size, 0, y); gr.addColorStop(0, '#fff2c4'); gr.addColorStop(.55, '#f2c25a'); gr.addColorStop(1, '#c0802a'); g.fillStyle = gr; g.shadowColor = 'rgba(255,190,90,.7)'; g.shadowBlur = 24; g.fillText(c, x, y); g.shadowBlur = 0; x += ws[i] + sp; }); };
    gold('TOBY & SELAH', 965, 96, 10);
  }
  window.__done = true;
});
</script></body></html>
