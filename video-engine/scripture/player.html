<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Nunito';font-weight:900;src:url('fonts/nunito-latin-900-normal.woff2') format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;src:url('fonts/nunito-latin-800-normal.woff2') format('woff2')}
@font-face{font-family:'Garamond';font-weight:500;src:url('fonts/eb-garamond-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Garamond';font-style:italic;font-weight:500;src:url('fonts/eb-garamond-latin-500-italic.woff2') format('woff2')}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="art/lib.js"></script><script src="art/chars.js"></script><script src="art/scenes.js"></script>
<script>
// Compositor: shot -> scene + camera (+ dissolve/flash), then captions, title card, pop words, name labels, grain + vignette.
const cv = document.getElementById('c'), G = cv.getContext('2d');
let EP = null; const CAP = { white: '#fffaf0', toby: '#ffb65c', selah: '#ffe39a', g: '#ffd36a', r: '#ff6b57', o: '#ffad5a' };
const SPEAKERCOL = { toby: CAP.toby };
function voiceAt(who, T) { for (const l of EP.lines) if (l.who === who && T >= l.t0 && T < l.t1) { const f = (T - l.t0) * 30, i = Math.floor(f), k = f - i, e = l.env; return lerp(e[i] || 0, e[i + 1] || 0, k); } return 0; }
function camAt(sh, lt) { const K = sh.cam || [[540, 960, 1]], d = sh.t1 - sh.t0; if (K.length === 1) return K[0]; const k = eio(lt / d) * (K.length - 1), i = Math.min(Math.floor(k), K.length - 2), f = k - i; return [0, 1, 2].map(j => lerp(K[i][j], K[i + 1][j], f)); }
function drawShot(g, sh, T) {
  const lt = T - sh.t0, d = sh.t1 - sh.t0, [cx, cy, z] = camAt(sh, lt);
  let sx = 0, sy = 0; const shk = (amp, t0) => { if (lt < t0) return; const e = Math.exp(-(lt - t0) * 6) * amp; sx += Math.sin(T * 61) * e; sy += Math.cos(T * 47) * e; };
  if (sh.shake) shk(sh.shake, 0); if (sh.shakeAt != null) shk(14, sh.shakeAt);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.translate(W / 2 + sx, H / 2 + sy); g.scale(z, z); g.translate(-cx, -cy);
  SC[sh.scene](g, sh.o || {}, { lt, T, d, V: w => voiceAt(w, T) });
  g.restore();
}
// ---------- captions ----------
function parseCap(s, base) { const out = []; let i = 0; const re = /\{(\w+):([^}]*)\}/g; let m; while ((m = re.exec(s))) { if (m.index > i) out.push([s.slice(i, m.index), base]); out.push([m[2], m[1] === 'pop' ? 'pop' : CAP[m[1]] || base]); i = re.lastIndex; } if (i < s.length) out.push([s.slice(i), base]); return out; }
function capColor(l) { const sh = shotAt(l.t0 + .01); if (l.who === 'toby') return CAP.toby; if (l.who === 'selah' && sh && sh.scene === 'road') return CAP.selah; return CAP.white; }
function drawCaptions(g, T) {
  let cur = null, nextT = 1e9;
  for (const l of EP.lines) for (const c of l.caps) { if (c.t0 <= T) cur = { c, l }; else { nextT = Math.min(nextT, c.t0); } }
  if (!cur) return; const { c, l } = cur, end = Math.min(nextT, c.t1 + 1.1); if (T > end) return;
  const segs = parseCap(c.text, capColor(l)).filter(s => s[1] !== 'pop'); if (!segs.length || !segs.some(s => s[0].trim())) return;
  const a = smooth(0, .12, T - c.t0) * (1 - smooth(end - .15, end, T)), rise = (1 - eo((T - c.t0) / .18)) * 10;
  g.save(); g.font = "900 50px Nunito"; g.textBaseline = 'middle'; g.globalAlpha = a;
  // word wrap
  const words = []; segs.forEach(([t, col]) => t.split(/(\s+)/).forEach(w => w && words.push([w, col])));
  const rows = [[]]; let wid = 0; words.forEach(w => { const ww = g.measureText(w[0]).width; if (wid + ww > 900 && w[0].trim()) { rows.push([]); wid = 0; } if (!(rows[rows.length - 1].length === 0 && !w[0].trim())) { rows[rows.length - 1].push(w); wid += ww; } });
  rows.forEach((r, ri) => { const tw = r.reduce((s, w) => s + g.measureText(w[0]).width, 0); let x = W / 2 - tw / 2; const y = 300 + ri * 62 + rise;
    r.forEach(([t, col]) => { g.shadowColor = 'rgba(20,10,5,.75)'; g.shadowBlur = 14; g.lineWidth = 7; g.strokeStyle = 'rgba(30,15,8,.55)'; g.lineJoin = 'round'; g.strokeText(t, x, y); g.shadowBlur = 0; g.fillStyle = col; g.fillText(t, x, y); x += g.measureText(t).width; }); });
  g.restore();
}
// ---------- pop words: big gold serif, letters drop in one by one ----------
function drawPops(g, T) {
  for (const sh of EP.shots) for (const p of (sh.pops || [])) {
    const l = EP.lines.find(x => x.id === p.line); const txt = (l.caps.map(c => (c.text.match(/\{pop:([^}]*)\}/) || [])[1]).find(Boolean) || '').toUpperCase(); if (!txt) continue;
    const t0 = l.t0 + .02, t1 = Math.max(l.t1 + .5, t0 + 1.2); if (T < t0 || T > t1 + .3) continue;
    const fade = 1 - smooth(t1, t1 + .3, T); const lt = T - t0, n = txt.length, per = Math.min(.055, (l.t1 - l.t0) * .5 / n);
    g.save(); g.translate(p.x, p.y); g.rotate(p.rot || 0); g.font = "500 150px Garamond"; g.textBaseline = 'middle'; g.globalAlpha = fade;
    const widths = [...txt].map(ch => g.measureText(ch).width + 6), tw = widths.reduce((a, b) => a + b, 0); let x = -tw / 2;
    if (tw > 980) { const s = 980 / tw; g.scale(s, s); }
    [...txt].forEach((ch, i) => { const k = clamp((lt - i * per) / .18); if (k <= 0) { x += widths[i]; return; } const s = 1 + (1 - eo(k)) * .9, dy = (1 - eo(k)) * -70;
      g.save(); g.translate(x + widths[i] / 2, dy); g.scale(s, s); g.globalAlpha = fade * clamp(k * 2);
      const gr = g.createLinearGradient(0, -60, 0, 60); gr.addColorStop(0, '#fff2bf'); gr.addColorStop(.45, '#f2c35a'); gr.addColorStop(1, '#b8691e');
      g.lineJoin = 'round'; g.lineWidth = 16; g.strokeStyle = '#3a1d0e'; g.strokeText(ch, -widths[i] / 2 + 3, 6); g.strokeText(ch, -widths[i] / 2, 0);
      g.fillStyle = '#7a3e16'; g.fillText(ch, -widths[i] / 2 + 3, 7); g.fillStyle = gr; g.fillText(ch, -widths[i] / 2, 0); g.restore(); x += widths[i]; });
    g.restore();
  }
}
// ---------- title card + name labels (spaced gold serif) ----------
function spaced(g, txt, x, y, sp) { const ws = [...txt].map(c => g.measureText(c).width), tw = ws.reduce((a, b) => a + b, 0) + sp * (txt.length - 1); let xx = x - tw / 2; [...txt].forEach((c, i) => { g.fillText(c, xx, y); xx += ws[i] + sp; }); }
function goldText(g, draw, a) { g.save(); g.globalAlpha = a; g.shadowColor = 'rgba(30,12,4,.8)'; g.shadowBlur = 18; g.fillStyle = '#2a140a'; draw(1, 3); g.shadowBlur = 0; const gr = g.createLinearGradient(0, -50, 0, 30); gr.addColorStop(0, '#fff0c0'); gr.addColorStop(.5, '#f0c25e'); gr.addColorStop(1, '#c58a32'); g.fillStyle = '#f0c25e'; draw(0, 0); g.restore(); }
function drawTitle(g, T) {
  const ti = EP.title; if (!ti || T > ti.t1 + .6) return; const a = smooth(ti.t0, ti.t0 + .5, T) * (1 - smooth(ti.t1, ti.t1 + .6, T));
  g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  goldText(g, (dx, dy) => { g.font = "500 96px Garamond"; spaced(g, ti.text, W / 2 + dx, 168 + dy, 22); }, a);
  goldText(g, (dx, dy) => { g.font = "italic 500 36px Garamond"; spaced(g, '— ' + ti.sub + ' —', W / 2 + dx, 220 + dy, 2); }, a * .95);
}
function drawLabels(g, T) {
  for (const sh of EP.shots) if (sh.label) { const t0 = sh.t0 + (sh.labelAt ?? .5), t1 = Math.min(t0 + 2.6, sh.t1); if (T < t0 || T > t1) continue; const a = smooth(t0, t0 + .4, T) * (1 - smooth(t1 - .4, t1, T));
    goldText(g, (dx, dy) => { g.font = "500 64px Garamond"; spaced(g, sh.label, W / 2 + dx, 1700 + dy, 14); }, a * .92); }
}
// ---------- post ----------
const NZ = document.createElement('canvas'); NZ.width = 540; NZ.height = 960; { const x = NZ.getContext('2d'), d = x.createImageData(540, 960), r = rng(5); for (let i = 0; i < d.data.length; i += 4) { const v = 110 + r() * 40; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); }
function post(g, T) {
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = .16; const f = Math.floor(T * 15); g.drawImage(NZ, -(f * 37 % 200), -(f * 53 % 300), 1620, 2880);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.fillStyle = rg(g, W / 2, H * .48, H * .28, H * .78, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(25,10,5,.55)']]); g.fillRect(0, 0, W, H);
  g.restore();
}
const [LA, LAX] = [document.createElement('canvas'), null];
function shotAt(T) { for (const s of EP.shots) if (T >= s.t0 && T < s.t1) return s; return EP.shots[EP.shots.length - 1]; }
const BUF = document.createElement('canvas'); BUF.width = W; BUF.height = H; const BG = BUF.getContext('2d');
window.__render = T => {
  const i = EP.shots.indexOf(shotAt(T)), sh = EP.shots[i], lt = T - sh.t0;
  drawShot(G, sh, T);
  if (sh.tr === 'fade' && lt < .5 && i > 0) { drawShot(BG, EP.shots[i - 1], T); G.save(); G.globalAlpha = 1 - eio(lt / .5); G.drawImage(BUF, 0, 0); G.restore(); }
  post(G, T);
  if (sh.tr === 'flash' && lt < .45) { G.save(); G.globalAlpha = 1 - eo(lt / .45); G.fillStyle = '#fff8e8'; G.fillRect(0, 0, W, H); G.restore(); }
  if (T < .3) { G.save(); G.globalAlpha = 1 - T / .3; G.fillStyle = '#000'; G.fillRect(0, 0, W, H); G.restore(); }
  if (T > EP.total - .5) { G.save(); G.globalAlpha = smooth(EP.total - .5, EP.total, T); G.fillStyle = '#000'; G.fillRect(0, 0, W, H); G.restore(); }
  G.save(); G.setTransform(1, 0, 0, 1, 0, 0); drawTitle(G, T); drawLabels(G, T); drawCaptions(G, T); drawPops(G, T); G.restore();
};
window.__load = e => { EP = e; };
document.fonts.load("900 50px Nunito").then(() => document.fonts.load("500 96px Garamond")).then(() => document.fonts.load("italic 500 36px Garamond")).then(() => { window.__ready = true; });
</script></body></html>
