  if (shuriken) { g.fillStyle = 'rgba(230,248,255,.85)'; for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + .3; g.beginPath(); g.moveTo(x + Math.cos(a) * r * .6, y + Math.sin(a) * r * .6); g.quadraticCurveTo(x + Math.cos(a + .4) * r * 3.2, y + Math.sin(a + .4) * r * 3.2, x + Math.cos(a + .9) * r * 4.2, y + Math.sin(a + .9) * r * 4.2); g.quadraticCurveTo(x + Math.cos(a + .2) * r * 2, y + Math.sin(a + .2) * r * 2, x + Math.cos(a - .3) * r * .6, y + Math.sin(a - .3) * r * .6); g.fill(); } glow(x, y, r * 5, 'rgba(200,235,255,.35)'); } }
function orb(x, y, r, core = '#120a1a', rim = 'rgba(160,80,255,.8)') { glow(x, y, r * 2.6, rim); g.fillStyle = core; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = r * .08; g.beginPath(); g.arc(x - r * .2, y - r * .2, r * .6, Math.PI * 1.1, Math.PI * 1.5); g.stroke(); }
function shock(x, y, r, col = '255,255,255', n = 3) { for (let i = 0; i < n; i++) { g.strokeStyle = `rgba(${col},${.7 - i * .2})`; g.lineWidth = 18 - i * 5; g.beginPath(); g.ellipse(x, y, r * (1 + i * .35), r * (1 + i * .35) * .45, 0, 0, TAU); g.stroke(); } }
function debris(x, y, n = 40, seed = 3, spread = 700) { const r = rng(seed); for (let i = 0; i < n; i++) { const a = r() * TAU, d = r() * spread, s = 6 + r() * 24; g.fillStyle = r() < .5 ? '#4a2a1a' : '#7a4a2a'; g.save(); g.translate(x + Math.cos(a) * d, y + Math.sin(a) * d * .6); g.rotate(r() * 3); g.fillRect(-s / 2, -s / 2, s, s * .7); g.restore(); } }
function fox(x, y, s, a = 1) { g.save(); g.globalAlpha = a; g.translate(x, y); g.scale(s, s); g.lineJoin = 'round';
  const body = g.createLinearGradient(0, -520, 0, 260); body.addColorStop(0, '#ffd84a'); body.addColorStop(1, '#ff7a14');
  // nine tails fanning out behind
  for (let i = 0; i < 9; i++) { const an = -2.75 + i * .32, ex = Math.cos(an) * 560, ey = Math.sin(an) * 430 - 40; g.fillStyle = body; g.strokeStyle = '#3a1806'; g.lineWidth = 10; g.beginPath(); g.moveTo(-40, 40); g.quadraticCurveTo(ex * .5 - 60, ey * .5 - 120, ex, ey); g.quadraticCurveTo(ex * .6 + 40, ey * .5 + 30, 40, 60); g.closePath(); g.fill(); g.stroke(); }
  // body
  g.fillStyle = body; g.strokeStyle = '#3a1806'; g.lineWidth = 12; g.beginPath(); g.ellipse(0, 60, 230, 190, 0, 0, TAU); g.fill(); g.stroke();
  // ears
  [[-1], [1]].forEach(([d]) => { g.beginPath(); g.moveTo(d * 70, -300); g.lineTo(d * 200, -560); g.lineTo(d * 190, -290); g.closePath(); g.fill(); g.stroke(); g.fillStyle = '#3a1806'; g.beginPath(); g.moveTo(d * 100, -310); g.lineTo(d * 185, -500); g.lineTo(d * 175, -310); g.closePath(); g.fill(); g.fillStyle = body; });
  // head + snout
  g.beginPath(); g.ellipse(0, -230, 200, 150, 0, 0, TAU); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-110, -190); g.quadraticCurveTo(0, -60, 110, -190); g.quadraticCurveTo(0, -150, -110, -190); g.fillStyle = '#ffe6a0'; g.fill(); g.stroke();
  g.fillStyle = '#1a0a04'; g.beginPath(); g.ellipse(0, -128, 26, 16, 0, 0, TAU); g.fill();
  // eyes: slit pupils, angry brows
  [[-1], [1]].forEach(([d]) => { g.fillStyle = '#ff3a1a'; g.beginPath(); g.moveTo(d * 40, -250); g.quadraticCurveTo(d * 100, -300, d * 150, -260); g.quadraticCurveTo(d * 100, -220, d * 40, -250); g.fill(); g.strokeStyle = '#3a1806'; g.lineWidth = 8; g.stroke(); g.fillStyle = '#120404'; g.fillRect(d * 95 - 5, -282, 10, 40); g.lineWidth = 14; g.beginPath(); g.moveTo(d * 30, -300); g.lineTo(d * 160, -320); g.stroke(); });
  // grin with fangs
  g.strokeStyle = '#3a1806'; g.lineWidth = 9; g.beginPath(); g.moveTo(-90, -120); g.quadraticCurveTo(0, -80, 90, -120); g.stroke(); g.fillStyle = '#fff'; [[-50], [50]].forEach(([d]) => { g.beginPath(); g.moveTo(d - 12, -104); g.lineTo(d, -76); g.lineTo(d + 12, -104); g.fill(); });
  // chakra seal swirl on belly
  g.strokeStyle = '#3a1806'; g.lineWidth = 7; for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(0, 70, 30 + i * 26, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
  g.restore(); glow(x, y - 100 * s, 760 * s, 'rgba(255,170,40,.35)', a); }
function fist(x, y, s, col = '#f2c49a', haki) { g.save(); g.translate(x, y); g.scale(s, s); g.lineJoin = 'round';
  const base = haki ? g.createLinearGradient(-200, -160, 200, 160) : null; if (base) { base.addColorStop(0, '#4a4a58'); base.addColorStop(.45, '#16161c'); base.addColorStop(1, '#2a0a14'); }
  g.fillStyle = base || col; g.strokeStyle = haki ? '#000' : INK; g.lineWidth = 12;
  // palm block + four knuckles + thumb across the front
  g.beginPath(); g.roundRect(-170, -70, 340, 230, 80); g.fill(); g.stroke();
  for (let i = 0; i < 4; i++) { g.beginPath(); g.roundRect(-168 + i * 84, -150, 82, 150, 38); g.fill(); g.stroke(); }
  g.beginPath(); g.roundRect(-200, 10, 270, 90, 45); g.fill(); g.stroke();
  if (haki) { g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 10; for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(-127 + i * 84, -112, 22, Math.PI * 1.1, Math.PI * 1.6); g.stroke(); } g.beginPath(); g.moveTo(-150, -40); g.lineTo(140, -50); g.stroke(); g.strokeStyle = 'rgba(255,40,80,.7)'; g.lineWidth = 5; g.beginPath(); g.moveTo(-160, 90); g.lineTo(-40, 60); g.lineTo(40, 110); g.lineTo(150, 70); g.stroke(); }
  g.restore(); }
function lightning(x, y, n, len, seed, col = '#ff2a4a', w = 6) { const r = rng(seed); g.strokeStyle = col; g.lineWidth = w; g.shadowColor = col; g.shadowBlur = 20; for (let i = 0; i < n; i++) { let px = x, py = y; const a = r() * TAU; g.beginPath(); g.moveTo(px, py); for (let k = 0; k < 6; k++) { px += Math.cos(a) * len / 6 + (r() - .5) * 60; py += Math.sin(a) * len / 6 + (r() - .5) * 60; g.lineTo(px, py); } g.stroke(); } g.shadowBlur = 0; }
function after(fn, n, dx, dy) { for (let i = n; i > 0; i--) { g.globalAlpha = .18 + .1 * (n - i); fn(i * dx, i * dy, .25 + .1 * (n - i)); } g.globalAlpha = 1; fn(0, 0, 1); }
